<!DOCTYPE html>
<!-- Source for assets/og-image.png (1200×630). Re-render with tools/render-og.sh -->
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Geist', Arial, sans-serif;
    background: radial-gradient(60% 70% at 85% 50%, #FFF4B8 0%, transparent 70%), #FAF8F5;
    color: #26201A;
    display: grid;
    grid-template-columns: 1fr 470px;
    align-items: center;
    padding: 0 64px 0 80px;
  }
  .logo { height: 28px; margin-bottom: 40px; }
  h1 { font-size: 66px; font-weight: 600; line-height: 1.06; letter-spacing: -0.035em; }
  .sub { margin-top: 24px; font-size: 26px; color: #6E655B; }
  .stack { position: relative; height: 460px; }
  .card {
    position: absolute; left: 50%; top: 40px; width: 270px; height: 360px; margin-left: -135px;
    background: #fff; border: 1px solid #E7E2DA; border-radius: 26px;
    box-shadow: 0 22px 50px rgba(38,32,26,0.16);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px; text-align: center;
  }
  .art { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #FFEF89, #FFDD00 75%); font-size: 64px; }
  .name { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
  .l { transform: translateX(-38%) translateY(16px) rotate(-11deg); }
  .r { transform: translateX(38%) translateY(16px) rotate(11deg); }
  .f { transform: rotate(4deg); }
  .l .name, .r .name { visibility: hidden; }
</style>
</head>
<body>
  <div>
    <img class="logo" src="../assets/shapes-logo.svg" alt="">
    <h1>How much of your week does admin steal?</h1>
    <p class="sub">Swipe 10 HR tasks. Takes about a minute.</p>
  </div>
  <div class="stack">
    <div class="card l"><div class="art"><i class="ti ti-clock-hour-4"></i></div><p class="name">x</p></div>
    <div class="card r"><div class="art"><i class="ti ti-message-question"></i></div><p class="name">x</p></div>
    <div class="card f"><div class="art"><i class="ti ti-beach"></i></div><p class="name">Approving time&#8209;off requests</p></div>
  </div>
</body>
</html>
